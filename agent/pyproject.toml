[project]
name = "flip-agent"
version = "0.2.0"
description = "FLIP site agent: keeps data local and answers allowlisted federated learning tasks"
requires-python = ">=3.11"
dependencies = ["flipml", "numpy>=2.0", "httpx>=0.27", "cryptography>=43"]

[project.scripts]
flip-agent = "flip_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flip_agent"]
