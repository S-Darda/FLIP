[project]
name = "flipml"
version = "0.2.0"
description = "Shared training and aggregate-evaluation code for the FLIP coordinator and site agents"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flipml"]
